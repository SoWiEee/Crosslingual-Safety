[project]
name = "crosslingual-safety"
version = "0.1.0"
description = "Reproducible cross-lingual LLM safety experiments"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "deep-translator>=1.11.4",
    "httpx>=0.28.1",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
]

[project.optional-dependencies]
translation-google = ["google-cloud-translate>=3.20.0"]
translation-nllb = [
    "sentencepiece>=0.2.0",
    "torch>=2.5.0",
    "transformers>=4.48.0",
]

[project.scripts]
crosslingual-safety = "crosslingual_safety.cli:app"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12.20241230",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosslingual_safety"]

[tool.pytest.ini_options]
addopts = "-m 'not live_google and not live_nllb'"
testpaths = ["tests"]
markers = [
    "live_google: makes an explicitly authorized, paid Google Cloud Translation request",
    "live_nllb: loads the local NLLB checkpoint and runs an explicit CUDA translation",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data/raw", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = [
    "deep_translator",
    "google.cloud",
    "google.cloud.*",
    "pyarrow",
    "pyarrow.*",
    "torch",
    "torch.*",
    "transformers",
]
ignore_missing_imports = true
