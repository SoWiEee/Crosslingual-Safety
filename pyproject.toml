[project]
name = "crosslingual-safety"
version = "0.1.0"
description = "Reproducible cross-lingual LLM safety experiments"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
]

[project.scripts]
crosslingual-safety = "crosslingual_safety.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosslingual_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
