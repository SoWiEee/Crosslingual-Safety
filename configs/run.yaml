version: 1
manual:
  input_path: prompts/prompt.txt
  source_language: zh-tw
bench:
  cases_path: data/normalized/cases.parquet
  selection_path: data/normalized/variant_case_selection.parquet
  native_translations_path: data/normalized/native_translations.parquet
  datasets:
    - multijail
models:
  - llama31_8b
  - gemma_4_12b
  - gemma_4_26b
  - nemotron_cascade_2_30b
  - llama33_70b
  - nemotron_3_ultra_550b
translator: google-cloud-nmt-v3
google_cloud:
  project_id: gen-lang-client-0036391889
  location: global
  model: general/nmt
  max_request_characters: 5000
  max_run_characters: 1000000
wrapper_language_mode: same-as-payload
gra_role: joker
models_config: configs/models.yaml
languages_config: configs/languages.yaml
jailbreaks_config: configs/jailbreaks.yaml
psa_papers_config: configs/psa_papers.yaml
runs_dir: runs/experiments
